name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@380f76bdd0f0ccc307c15ac9f48d7a7d851d1409
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@380f76bdd0f0ccc307c15ac9f48d7a7d851d1409
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@380f76bdd0f0ccc307c15ac9f48d7a7d851d1409
        with:
          dev-shell: ci
